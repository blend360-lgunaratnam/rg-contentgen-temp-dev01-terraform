name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:   # manual re-run; also applies, same as a merge to main

permissions:
  id-token: write      # REQUIRED: mints the OIDC token. Without it, auth fails.
  contents: read
  pull-requests: write # to post the plan as a PR comment

# Never let two runs touch the state file at once.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VERSION: "1.9.8"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Publish plan to job summary
        run: |
          {
            echo "### Terraform Plan"
            echo '```terraform'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated, see job summary';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform Plan\n```terraform\n' + plan + '\n```'
            });

      - name: Upload plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

  apply:
    name: Apply
    needs: plan
    # Applies on merge to main (on.push is restricted to main), and on manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: development   # records deployments; keeps OIDC subject on env-development
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan